name: TenderLens Checks

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Run backend tests
        run: python -m unittest backend.test_api

  genlayer-direct-mode:
    name: GenLayer Direct Mode
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Node.js 22.14.0
        uses: actions/setup-node@v5
        with:
          node-version: "22.14.0"

      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.13.3"

      - name: Install and verify locked GenLayer environment
        run: bash .devcontainer/setup.sh --genlayer-only

      - name: Run GenLayer Direct Mode contract tests
        id: direct-tests
        run: |
          set +e
          .venv/bin/python -m pytest tests/genlayer_direct -v --tb=short 2>&1 | tee "$RUNNER_TEMP/direct-mode-pytest.log"
          result=${PIPESTATUS[0]}
          if [[ "$result" -ne 0 ]]; then
            detail="$(grep -E '^E   |^FAILED |^ERROR ' "$RUNNER_TEMP/direct-mode-pytest.log" | tail -n 4 | tr '\n' ' ' | cut -c 1-500)"
            if [[ -z "$detail" ]]; then detail="$(tail -n 5 "$RUNNER_TEMP/direct-mode-pytest.log" | tr '\n' ' ' | cut -c 1-500); fi
            printf 'failure-detail=%s\n' "$detail" >> "$GITHUB_OUTPUT"
          fi
          exit "$result"

      - name: Surface Direct Mode failure details: ${{ steps.direct-tests.outputs.failure-detail }}
        if: always() && steps.direct-tests.outcome == 'failure'
        run: echo "Direct Mode test failure summary is included in this step name."
